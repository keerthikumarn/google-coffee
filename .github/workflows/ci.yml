name: CI

# Check style, then build and test, on every push and every pull request.
# Style checks run before the tests so a formatting slip fails fast and cheaply.
on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (format, test, package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Fix locally with: ./mvnw spotless:apply
      - name: Check formatting
        run: ./mvnw -B spotless:check

      # The PostgreSQL adapter tests start a real database with Testcontainers; the Ubuntu runner provides
      # Docker. On a machine without Docker those tests are skipped, but here they are required: if Docker
      # were ever missing, REQUIRE_DOCKER_TESTS makes that fail the build instead of passing quietly.
      - name: Test
        env:
          REQUIRE_DOCKER_TESTS: 'true'
        run: ./mvnw -B test

      - name: Package
        run: ./mvnw -B -DskipTests package

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend (lint, test, build, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Node 20 is the lowest supported version (package.json engines), 22 matches the Dockerfile.
        node: ['20', '22']
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # Fix locally with: npm run lint:fix and npm run format
      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker-image:
    name: Production image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build image (not pushed)
        run: docker build -t google-coffee:ci .
