# Pull request checks for Google Coffee: tests only, nothing is built into an image or deployed.
# Triggered by pull requests targeting main (see README "CI/CD").
options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1. Backend tests. The Postgres adapter tests start a real database with Testcontainers, so
  #    maven runs inside the Docker builder with the host network and the Docker socket. On the
  #    default step network Testcontainers could not reach the containers it starts.
  - id: backend-tests
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --network=host
      - -v
      - /var/run/docker.sock:/var/run/docker.sock
      - -v
      - /workspace:/workspace
      - -w
      - /workspace/backend
      - -e
      - TESTCONTAINERS_RYUK_DISABLED=true
      - maven:3.9-eclipse-temurin-21
      - mvn
      - -B
      - test

  # 2. Frontend tests, then a production build to catch compile errors the tests don't import.
  #    Node 22 matches the Dockerfile.
  - id: frontend
    name: node:22-slim
    dir: frontend
    entrypoint: bash
    args:
      - -c
      - npm ci --no-audit --no-fund && npm test && npm run build
