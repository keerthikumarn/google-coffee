# CI/CD for Google Coffee: backend + frontend tests -> build image -> push -> deploy to Cloud Run -> smoke test.
# Triggered by a push to main (see setup-cicd.sh and README "CI/CD").
substitutions:
  _REGION: asia-south1
  _SERVICE: google-coffee
  _REPO: google-coffee
  _FIRESTORE_DATABASE: google-coffee
  _GEMINI_MODEL: gemini-2.5-flash
  _GEMINI_LOCATION: us-central1

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1. Backend tests. The Postgres adapter tests start a real database with Testcontainers, so
  #    maven runs inside the Docker builder with the host network and the Docker socket.
  #    A failing test stops the pipeline.
  - id: backend-tests
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --network=host
      - -v
      - /var/run/docker.sock:/var/run/docker.sock
      - -v
      - /workspace:/workspace
      - -w
      - /workspace/backend
      - -e
      - TESTCONTAINERS_RYUK_DISABLED=true
      - maven:3.9-eclipse-temurin-21
      - mvn
      - -B
      - test

  # 2. Frontend tests. The production build happens inside the Dockerfile.
  - id: frontend-tests
    name: node:22-slim
    dir: frontend
    entrypoint: bash
    args:
      - -c
      - npm ci --no-audit --no-fund && npm test

  # 3. Build the production image (React build + jar build happen inside the Dockerfile).
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  # 4. Push both tags to Artifact Registry.
  - id: push-image
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"]

  # 5. Deploy the exact image we just tested. Secrets come from Secret Manager.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --service-account=google-coffee-run@$PROJECT_ID.iam.gserviceaccount.com
      - --timeout=3600
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5
      - --set-env-vars=SPRING_PROFILES_ACTIVE=gcp,GCP_PROJECT_ID=$PROJECT_ID,FIRESTORE_DATABASE=${_FIRESTORE_DATABASE},GEMINI_MODEL=${_GEMINI_MODEL},GEMINI_LOCATION=${_GEMINI_LOCATION}
      - --set-secrets=STAFF_PIN=staff-pin:latest,STAFF_TOKEN_SECRET=staff-token-secret:latest

  # 6. Smoke test: the new revision must answer on /api/health.
  - id: smoke-test
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        URL=$$(gcloud run services describe ${_SERVICE} --region ${_REGION} --format='value(status.url)')
        echo "Checking $$URL/api/health"
        curl -fsS --retry 5 --retry-delay 5 "$$URL/api/health"
